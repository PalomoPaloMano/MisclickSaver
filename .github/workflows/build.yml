name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64
          combine: true

      - uses: actions/upload-artifact@v4
        with:
          name: MisclickSaver-Android
          path: ${{ steps.build.outputs.build-output }}
